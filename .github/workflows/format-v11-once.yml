name: TrailPath v1.1 one-shot formatter

on:
  push:
    branches:
      - feature/v1.1-v1.5

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/v1.1-v1.5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Format v1.1 Dart files
        run: |
          dart format             lib/features/planner/presentation/planner_screen.dart             lib/infrastructure/routing/valhalla_map_matching_engine.dart             test/core/architecture/smart_trace_map_layers_contract_test.dart             test/infrastructure/routing/valhalla_map_matching_engine_test.dart

      - name: Remove one-shot workflow and commit formatting
        run: |
          rm .github/workflows/format-v11-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/planner/presentation/planner_screen.dart             lib/infrastructure/routing/valhalla_map_matching_engine.dart             test/core/architecture/smart_trace_map_layers_contract_test.dart             test/infrastructure/routing/valhalla_map_matching_engine_test.dart             .github/workflows/format-v11-once.yml
          git commit -m "style: format v1.1 Smart Trace sources"
          git push origin HEAD:feature/v1.1-v1.5
