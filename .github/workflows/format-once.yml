name: TrailPath Format Once

on:
  push:
    branches: [dev/v0.9.13-production-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: dev/v0.9.13-production-hardening

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatting cleanup
        run: |
          if git diff --quiet -- lib test; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: normalize Dart formatting"
          git pull --rebase origin dev/v0.9.13-production-hardening
          git push origin HEAD:dev/v0.9.13-production-hardening

# trigger after workflow registration
