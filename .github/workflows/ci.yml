name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify committed Android scaffold
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/riccardopinato/trail_path/MainActivity.kt
          test -f android/app/src/main/res/drawable/ic_launcher.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Create pinned web shell
        run: |
          rm -rf /tmp/trailpath_web
          flutter create --platforms=web --org com.riccardopinato --project-name trail_path --no-pub /tmp/trailpath_web
          rm -rf web
          cp -R /tmp/trailpath_web/web ./web

      - name: Build web preview
        run: flutter build web --release --target lib/web_preview.dart --base-href "/TrailPath/"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build optimized release APKs
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk
          du -b build/app/outputs/flutter-apk/*.apk | sort -n

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.10.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload optimized release APKs
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.10.0-release-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  applab-android:
    name: AppLab Android Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download debug APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v0.10.0-debug
          path: apk

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run TrailPath through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_COARSE_LOCATION || true

            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/.maestro/applab-smoke.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" .applab/scripts/verify_apk.sh "$GITHUB_WORKSPACE/apk/app-debug.apk" "com.riccardopinato.trail_path"

            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
