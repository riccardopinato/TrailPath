name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.app-version.outputs.app_version }}
      store_signing_available: ${{ steps.store-signing.outputs.available }}
    env:
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
      MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY || vars.MAPTILER_API_KEY }}
      VALHALLA_BASE_URL: ${{ secrets.VALHALLA_BASE_URL || vars.VALHALLA_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
      PREMIUM_VERIFICATION_URL: ${{ secrets.PREMIUM_VERIFICATION_URL || vars.PREMIUM_VERIFICATION_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify committed Android scaffold
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/riccardopinato/trail_path/MainActivity.kt
          test -f android/app/src/main/res/drawable/ic_launcher.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'TRAILPATH_REQUIRE_STORE_SIGNING' android/app/build.gradle.kts

      - name: Read app version
        id: app-version
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          test -n "$APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Report optional runtime configuration
        run: |
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && echo "Google Sign-In: configured" || echo "Google Sign-In: not configured"
          [ -n "$MAPTILER_API_KEY" ] && echo "MapTiler: configured" || echo "MapTiler: not configured"
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && echo "Supabase: configured" || echo "Supabase: not configured"
          [ -n "$PREMIUM_VERIFICATION_URL" ] && echo "Play purchase verification: configured" || echo "Play purchase verification: not configured"
          missing=0
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] || missing=$((missing+1))
          [ -n "$MAPTILER_API_KEY" ] || missing=$((missing+1))
          { [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; } || missing=$((missing+1))
          [ -n "$PREMIUM_VERIFICATION_URL" ] || missing=$((missing+1))
          if [ "$missing" -gt 0 ]; then
            echo "::notice::Production services incomplete: $missing external service group(s) still need configuration."
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Audit dependency freshness
        run: |
          echo "Dependency freshness audit (informational):"
          flutter pub outdated --no-dev-dependencies || true

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Dart formatting
        run: |
          dart format lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Create pinned web shell
        run: |
          rm -rf /tmp/trailpath_web
          flutter create --platforms=web --org com.riccardopinato --project-name trail_path --no-pub /tmp/trailpath_web
          rm -rf web
          cp -R /tmp/trailpath_web/web ./web

      - name: Build Web Preview parity gate
        run: flutter build web --release --target lib/web_preview.dart --base-href "/TrailPath/"

      - name: Detect store signing credentials
        id: store-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAILPATH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRAILPATH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAILPATH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAILPATH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Store signing secrets are not configured; store-signed AAB will be skipped."
          fi

      - name: Build ARM64 optimized release
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL"

      - name: Verify Android release permission contract
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -f "$APK"
          test -x "$APKANALYZER"

          MIN_SDK="$("$APKANALYZER" manifest min-sdk "$APK")"
          TARGET_SDK="$("$APKANALYZER" manifest target-sdk "$APK")"
          "$APKANALYZER" manifest print "$APK" > "$RUNNER_TEMP/trailpath-release-manifest.xml"

          echo "Resolved minSdk: $MIN_SDK"
          echo "Resolved targetSdk: $TARGET_SDK"
          grep -Fq "android.permission.ACCESS_FINE_LOCATION" "$RUNNER_TEMP/trailpath-release-manifest.xml"
          grep -Fq "android.permission.ACCESS_COARSE_LOCATION" "$RUNNER_TEMP/trailpath-release-manifest.xml"
          grep -Fq "android.permission.FOREGROUND_SERVICE" "$RUNNER_TEMP/trailpath-release-manifest.xml"
          grep -Fq "android.permission.FOREGROUND_SERVICE_LOCATION" "$RUNNER_TEMP/trailpath-release-manifest.xml"
          grep -Fq "android.permission.POST_NOTIFICATIONS" "$RUNNER_TEMP/trailpath-release-manifest.xml"

      - name: Build x86_64 optimized release runtime gate
        run: |
          flutter build apk --release --target-platform android-x64 --split-per-abi \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL"

      - name: Build release AAB structure gate
        run: |
          flutter build appbundle --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL"

      - name: Upload CI-only AAB structure artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-ci-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Verify production services before store AAB
        if: steps.store-signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          missing=0
          for name in GOOGLE_SERVER_CLIENT_ID MAPTILER_API_KEY VALHALLA_BASE_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY PREMIUM_VERIFICATION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a fully enabled store-signed TrailPath build."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Build store-signed AAB
        if: steps.store-signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAILPATH_KEYSTORE_BASE64 }}
          TRAILPATH_STORE_PASSWORD: ${{ secrets.TRAILPATH_STORE_PASSWORD }}
          TRAILPATH_KEY_ALIAS: ${{ secrets.TRAILPATH_KEY_ALIAS }}
          TRAILPATH_KEY_PASSWORD: ${{ secrets.TRAILPATH_KEY_PASSWORD }}
          TRAILPATH_REQUIRE_STORE_SIGNING: "true"
        run: |
          set -euo pipefail
          umask 077
          STORE_FILE="$RUNNER_TEMP/trailpath-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          test -s "$STORE_FILE"
          TRAILPATH_STORE_FILE="$STORE_FILE" flutter build appbundle --release \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL" \
            --dart-define=TRAILPATH_REQUIRE_SERVER_VERIFICATION=true
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Upload store-signed AAB
        if: steps.store-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report release APK sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*-release.apk
          du -b build/app/outputs/flutter-apk/*-release.apk | sort -n

      - name: Enforce ARM64 RC size budget
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          SIZE="$(stat -c%s "$APK")"
          MAX_BYTES=$((40 * 1024 * 1024))
          echo "ARM64 APK: $SIZE bytes; RC budget: $MAX_BYTES bytes"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::ARM64 APK exceeds the 40 MiB release-candidate budget."
            exit 1
          fi

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Build ARM64 internal Pro QA release
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL" \
            --dart-define=TRAILPATH_INTERNAL_PRO=true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/TrailPath-internal-pro-arm64.apk

      - name: Upload ARM64 internal Pro QA APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-internal-pro-arm64
          path: build/app/outputs/flutter-apk/TrailPath-internal-pro-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build x86_64 internal Pro QA release
        run: |
          flutter build apk --release --target-platform android-x64 --split-per-abi \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=MAPTILER_API_KEY="$MAPTILER_API_KEY" \
            --dart-define=VALHALLA_BASE_URL="$VALHALLA_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PREMIUM_VERIFICATION_URL="$PREMIUM_VERIFICATION_URL" \
            --dart-define=TRAILPATH_INTERNAL_PRO=true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/flutter-apk/TrailPath-internal-pro-x86_64.apk

      - name: Upload x86_64 internal Pro QA APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-internal-pro-x86_64
          path: build/app/outputs/flutter-apk/TrailPath-internal-pro-x86_64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload x86_64 release runtime APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-ci-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 1

  routing-provider-smoke:
    name: Live Routing Provider Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify OSM foot routing endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'Accept: application/json'             'https://routing.openstreetmap.de/routed-foot/route/v1/driving/11.750000,45.232000;11.754000,45.235000?overview=false&steps=false'             | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('code') == 'Ok'; assert d.get('routes')"

      - name: Verify Valhalla route endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data '{"locations":[{"lat":45.232,"lon":11.75},{"lat":45.235,"lon":11.754}],"costing":"pedestrian","directions_type":"none","units":"kilometers","shape_format":"geojson"}'             'https://valhalla1.openstreetmap.de/route'             | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('trip'); assert d['trip'].get('legs')"

      - name: Verify Valhalla trace endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             -H 'Accept: application/json'             -H 'Content-Type: application/json'             --data '{"shape":[{"lat":39.983841,"lon":-76.735741},{"lat":39.983704,"lon":-76.735298},{"lat":39.983578,"lon":-76.734848},{"lat":39.983551,"lon":-76.734253},{"lat":39.983555,"lon":-76.734116},{"lat":39.983589,"lon":-76.733315}],"costing":"pedestrian","shape_match":"walk_or_snap","directions_type":"none","directions_options":{"units":"kilometers"},"trace_options":{"gps_accuracy":10,"search_radius":32}}'             'https://valhalla1.openstreetmap.de/trace_route'             | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('trip'); assert d['trip'].get('legs')"

  android-api29-smoke:
    name: Android API 29 Release Smoke
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Download x86_64 release APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and restart release on API 29
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            bash "$GITHUB_WORKSPACE/.maestro/run-api29-smoke.sh"

      - name: Upload API 29 smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-API29-Smoke-${{ github.sha }}
          path: api29-report/
          if-no-files-found: warn
          retention-days: 30

  applab-android:
    name: AppLab Android E2E Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download x86_64 release APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: apk

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          ref: d6dba6dd0e4d64bcdcbe656193e1f7d24a291029
          path: .applab

      - name: Verify pinned AppLab identity
        run: |
          set -euo pipefail
          ACTUAL_APPLAB_SHA="$(git -C .applab rev-parse HEAD)"
          test "$ACTUAL_APPLAB_SHA" = "d6dba6dd0e4d64bcdcbe656193e1f7d24a291029"
          echo "Pinned AppLab: $ACTUAL_APPLAB_SHA"

      - name: Stabilize AppLab crawler startup readiness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".applab/scripts/verify_apk.sh")
          text = path.read_text(encoding="utf-8")
          old = "--settle-seconds 1.5"
          new = "--settle-seconds 5.0"
          if old not in text:
              raise SystemExit("Pinned AppLab crawler settle contract changed unexpectedly")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          grep -Fq -- '--settle-seconds 5.0' .applab/scripts/verify_apk.sh

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run TrailPath release through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb install -r apk/app-x86_64-release.apk
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.POST_NOTIFICATIONS || true
            adb emu geo fix 11.7500 45.2320 100 || true

            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/.maestro/applab-e2e.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" .applab/scripts/verify_apk.sh "$GITHUB_WORKSPACE/apk/app-x86_64-release.apk" "com.riccardopinato.trail_path"

            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"
            ! grep -Eq "ANR in com\\.riccardopinato\\.trail_path|Process: com\\.riccardopinato\\.trail_path.*FATAL" "$GITHUB_WORKSPACE/applab-report/logcat.txt"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14


  applab-v15-pro:
    name: AppLab v1.5 Pro Routing Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download internal Pro x86_64 APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-internal-pro-x86_64
          path: apk-pro

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          ref: d6dba6dd0e4d64bcdcbe656193e1f7d24a291029
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run v1.5 Pro routing flow
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.maestro/run-applab-v15-pro.sh" "$GITHUB_WORKSPACE/apk-pro/TrailPath-internal-pro-x86_64.apk" "$GITHUB_WORKSPACE/applab-v15-report"

      - name: Upload v1.5 Pro AppLab report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-AppLab-v15-Pro-${{ github.sha }}
          path: applab-v15-report/
          if-no-files-found: warn
          retention-days: 14

  applab-ux-matrix:
    name: AppLab Small-screen / Large-text UX Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download x86_64 release APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: apk-ux

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          ref: d6dba6dd0e4d64bcdcbe656193e1f7d24a291029
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run constrained UX matrix through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.maestro/run-applab-ux-matrix.sh" "$GITHUB_WORKSPACE/apk-ux/app-x86_64-release.apk" "$GITHUB_WORKSPACE/applab-ux-report"

      - name: Upload AppLab UX matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-AppLab-UX-${{ github.sha }}
          path: applab-ux-report/
          if-no-files-found: warn
          retention-days: 30

  upgrade-migration:
    name: TrailPath Upgrade / Migration AppLab
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download current x86_64 release APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: upgrade-current

      - name: Download pinned v1.5.11 migration baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_NAME: TrailPath-upgrade-baseline-v1.5.11-x86_64
          BOOTSTRAP_ARTIFACT_ID: "11021533532"
        run: |
          set -euo pipefail
          BASELINE_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BASELINE_NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')"
          if [ -z "$BASELINE_ID" ]; then
            BASELINE_ID="$BOOTSTRAP_ARTIFACT_ID"
            echo "Using bootstrap migration artifact: $BASELINE_ID"
          else
            echo "Using retained migration baseline artifact: $BASELINE_ID"
          fi
          mkdir -p upgrade-baseline
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ID/zip" > "$RUNNER_TEMP/trailpath-migration-baseline.zip"
          unzip -q "$RUNNER_TEMP/trailpath-migration-baseline.zip" -d upgrade-baseline
          test -f upgrade-baseline/app-x86_64-release.apk
          echo "Baseline artifact id: $BASELINE_ID"
          sha256sum upgrade-baseline/app-x86_64-release.apk

      - name: Refresh retained v1.5.11 migration baseline
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-upgrade-baseline-v1.5.11-x86_64
          path: upgrade-baseline/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          ref: d6dba6dd0e4d64bcdcbe656193e1f7d24a291029
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          chmod +x .maestro/run-upgrade-migration.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade v1.5.11 artifact to current release in place
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash "$GITHUB_WORKSPACE/.maestro/run-upgrade-migration.sh" "$GITHUB_WORKSPACE/upgrade-baseline/app-x86_64-release.apk" "$GITHUB_WORKSPACE/upgrade-current/app-x86_64-release.apk" "$GITHUB_WORKSPACE/upgrade-migration-report"

      - name: Upload upgrade migration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-Upgrade-Migration-${{ github.sha }}
          path: upgrade-migration-report/
          if-no-files-found: warn
          retention-days: 30

  certification-evidence:
    name: Release Certification Evidence
    needs: [validate-and-build, routing-provider-smoke, android-api29-smoke, applab-android, applab-v15-pro, applab-ux-matrix, upgrade-migration]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout certification source
        uses: actions/checkout@v6

      - name: Download ARM64 release candidate
        if: needs.validate-and-build.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-arm64-release
          path: certification/arm64

      - name: Download x86_64 AppLab artifact
        if: needs.validate-and-build.result == 'success'
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: certification/x86_64

      - name: Download store-signed AAB
        if: needs.validate-and-build.outputs.store_signing_available == 'true'
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-store-aab
          path: certification/store-aab

      - name: Download AppLab evidence
        if: needs.applab-android.result != 'skipped' && needs.applab-android.result != 'cancelled'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: certification/applab

      - name: Download Pro routing evidence
        if: needs.applab-v15-pro.result != 'skipped' && needs.applab-v15-pro.result != 'cancelled'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-AppLab-v15-Pro-${{ github.sha }}
          path: certification/pro-routing


      - name: Download UX matrix evidence
        if: needs.applab-ux-matrix.result != 'skipped' && needs.applab-ux-matrix.result != 'cancelled'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-AppLab-UX-${{ github.sha }}
          path: certification/ux-matrix

      - name: Download upgrade migration evidence
        if: needs.upgrade-migration.result != 'skipped' && needs.upgrade-migration.result != 'cancelled'
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-Upgrade-Migration-${{ github.sha }}
          path: certification/upgrade

      - name: Build certification Evidence Bundle
        env:
          BUILD_RESULT: ${{ needs.validate-and-build.result }}
          APPLAB_RESULT: ${{ needs.applab-android.result }}
          PRO_ROUTING_RESULT: ${{ needs.applab-v15-pro.result }}
          ROUTING_PROVIDER_RESULT: ${{ needs.routing-provider-smoke.result }}
          API29_RESULT: ${{ needs.android-api29-smoke.result }}
          UX_MATRIX_RESULT: ${{ needs.applab-ux-matrix.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-migration.result }}
          STORE_SIGNING_AVAILABLE: ${{ needs.validate-and-build.outputs.store_signing_available }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPLAB_HARNESS_SHA: d6dba6dd0e4d64bcdcbe656193e1f7d24a291029
        run: |
          set -euo pipefail
          mkdir -p certification

          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          SOURCE_SHA="${PR_HEAD_SHA:-$GITHUB_SHA}"
          TEST_SHA="$GITHUB_SHA"

          hash_or_na() {
            local path="$1"
            if [ -f "$path" ]; then
              sha256sum "$path" | awk '{print $1}'
            else
              printf 'N/A'
            fi
          }

          size_or_na() {
            local path="$1"
            if [ -f "$path" ]; then
              stat -c%s "$path"
            else
              printf 'N/A'
            fi
          }

          ARM64_APK="certification/arm64/app-arm64-v8a-release.apk"
          X86_APK="certification/x86_64/app-x86_64-release.apk"
          STORE_AAB="certification/store-aab/app-release.aab"

          ARM64_SHA256="$(hash_or_na "$ARM64_APK")"
          X86_SHA256="$(hash_or_na "$X86_APK")"
          STORE_AAB_SHA256="$(hash_or_na "$STORE_AAB")"
          ARM64_BYTES="$(size_or_na "$ARM64_APK")"
          X86_BYTES="$(size_or_na "$X86_APK")"
          STORE_AAB_BYTES="$(size_or_na "$STORE_AAB")"

          if [ "$BUILD_RESULT" = "success" ]; then
            test -n "$ARM64_SHA256"
            test -n "$X86_SHA256"
            test -n "$ARM64_BYTES"
            test -n "$X86_BYTES"
            test "$ARM64_SHA256" != "N/A"
            test "$X86_SHA256" != "N/A"
            test "$ARM64_BYTES" != "N/A"
            test "$X86_BYTES" != "N/A"
          fi

          PHYSICAL_QA="$(awk -F': ' '/^- Physical ARM64 device QA:/ {print $2}' docs/PRODUCTION_APPROVAL.md | tr -d '\r')"
          STORE_REVIEW="$(awk -F': ' '/^- Play Store listing\/screenshots review:/ {print $2}' docs/PRODUCTION_APPROVAL.md | tr -d '\r')"
          ROLLOUT_REVIEW="$(awk -F': ' '/^- Staged rollout \/ rollback review:/ {print $2}' docs/PRODUCTION_APPROVAL.md | tr -d '\r')"

          if [ "$BUILD_RESULT" = "success" ] && \
             [ "$ROUTING_PROVIDER_RESULT" = "success" ] && \
             [ "$API29_RESULT" = "success" ] && \
             [ "$APPLAB_RESULT" = "success" ] && \
             [ "$PRO_ROUTING_RESULT" = "success" ] && \
             [ "$UX_MATRIX_RESULT" = "success" ] && \
             [ "$UPGRADE_RESULT" = "success" ]; then
            AUTOMATED_VALIDATION="PASS"
          else
            AUTOMATED_VALIDATION="FAIL"
          fi

          if [ "$AUTOMATED_VALIDATION" != "PASS" ]; then
            VERDICT="NOT CERTIFIED"
          elif [ "$STORE_SIGNING_AVAILABLE" != "true" ] || [ "$PHYSICAL_QA" != "PASS" ] || [ "$STORE_REVIEW" != "PASS" ] || [ "$ROLLOUT_REVIEW" != "PASS" ]; then
            VERDICT="BLOCKED"
          else
            VERDICT="CERTIFIED"
          fi

          cat > certification/EVIDENCE_BUNDLE.md <<EOF
          # TrailPath Release Evidence Bundle

          - Verdict: **$VERDICT**
          - App version/build: **$APP_VERSION**
          - Source head SHA: **$SOURCE_SHA**
          - CI tested SHA: **$TEST_SHA**
          - Workflow run: **$GITHUB_RUN_ID**
          - Automated validation: **$AUTOMATED_VALIDATION**
          - Certification status: **$VERDICT**
          - AppLab harness SHA: **$APPLAB_HARNESS_SHA**
          - Flutter: **3.47.5**
          - Dart: **3.13.4**
          - Android AppLab matrix: **API 35 / google_apis / x86_64 / Pixel 7 Pro profile**

          ## Automated gates

          - validate-and-build: **$BUILD_RESULT**
          - Live routing provider smoke: **$ROUTING_PROVIDER_RESULT**
          - Android API 29 release smoke: **$API29_RESULT**
          - AppLab Android E2E (API 35): **$APPLAB_RESULT**
          - AppLab v1.5 Pro routing: **$PRO_ROUTING_RESULT**
          - AppLab small-screen / large-text UX matrix: **$UX_MATRIX_RESULT**
          - Upgrade / Migration AppLab (v1.5.11 → current): **$UPGRADE_RESULT**
          - Store-signing credentials available: **$STORE_SIGNING_AVAILABLE**
          - Formatting / analyze / full Flutter tests: tied to validate-and-build
          - ARM64 release / x86_64 release / AAB structure / size budget: tied to validate-and-build
          - Focused no-network navigation: tied to AppLab Android E2E

          ## Artifact identity

          - AppLab-tested x86_64 APK SHA-256: **$X86_SHA256**
          - AppLab-tested x86_64 APK bytes: **$X86_BYTES**
          - ARM64 distribution candidate SHA-256: **$ARM64_SHA256**
          - ARM64 distribution candidate bytes: **$ARM64_BYTES**
          - Store-signed AAB SHA-256: **$STORE_AAB_SHA256**
          - Store-signed AAB bytes: **$STORE_AAB_BYTES**

          The x86_64 APK is the exact artifact exercised by AppLab. The ARM64
          candidate requires physical-device validation of this exact SHA-256
          before production certification.

          ## External production gates

          - Physical ARM64 device QA: **$PHYSICAL_QA**
          - Play Store listing/screenshots review: **$STORE_REVIEW**
          - Staged rollout / rollback review: **$ROLLOUT_REVIEW**

          ## Certification rule

          **CERTIFIED** requires all automated gates to pass, store-signing
          credentials to be available, and every external production gate above
          to be PASS. Automated failure yields **NOT CERTIFIED**. Missing external
          evidence yields **BLOCKED**.
          EOF

          printf '%s\n' "$VERDICT" > certification/VERDICT.txt
          {
            printf '%s  %s\n' "$X86_SHA256" "app-x86_64-release.apk"
            printf '%s  %s\n' "$ARM64_SHA256" "app-arm64-v8a-release.apk"
            printf '%s  %s\n' "$STORE_AAB_SHA256" "app-release.aab"
          } > certification/ARTIFACT_SHA256.txt

          grep -Fq "$ARM64_SHA256" certification/EVIDENCE_BUNDLE.md
          grep -Fq "$X86_SHA256" certification/EVIDENCE_BUNDLE.md
          grep -Fq "$SOURCE_SHA" certification/EVIDENCE_BUNDLE.md
          grep -Fq "$TEST_SHA" certification/EVIDENCE_BUNDLE.md
          grep -Fq "Automated validation: **$AUTOMATED_VALIDATION**" certification/EVIDENCE_BUNDLE.md
          grep -Fq "$APPLAB_HARNESS_SHA" certification/EVIDENCE_BUNDLE.md

          if [ -f certification/applab/summary.md ]; then
            cp certification/applab/summary.md certification/APPLAB_SUMMARY.md
          fi
          if [ -f certification/ux-matrix/summary.md ]; then
            cp certification/ux-matrix/summary.md certification/APPLAB_UX_MATRIX_SUMMARY.md
          fi
          if [ -f certification/upgrade/summary.md ]; then
            cp certification/upgrade/summary.md certification/UPGRADE_MIGRATION_SUMMARY.md
          fi

          echo "Certification verdict: $VERDICT"
          if [ "$VERDICT" = "BLOCKED" ]; then
            echo "::warning::TrailPath production certification is BLOCKED by external release gates."
          elif [ "$VERDICT" = "NOT CERTIFIED" ]; then
            echo "::error::TrailPath automated certification failed."
          fi

      - name: Upload release Evidence Bundle
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-Evidence-Bundle
          path: |
            certification/EVIDENCE_BUNDLE.md
            certification/VERDICT.txt
            certification/ARTIFACT_SHA256.txt
            certification/APPLAB_SUMMARY.md
            certification/APPLAB_UX_MATRIX_SUMMARY.md
            certification/UPGRADE_MIGRATION_SUMMARY.md
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact ARM64 certification candidate
        if: needs.validate-and-build.result == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ARM64-Certification-Candidate
          path: |
            certification/arm64/app-arm64-v8a-release.apk
            certification/EVIDENCE_BUNDLE.md
            certification/VERDICT.txt
            certification/ARTIFACT_SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce automated certification result
        if: always()
        env:
          BUILD_RESULT: ${{ needs.validate-and-build.result }}
          ROUTING_PROVIDER_RESULT: ${{ needs.routing-provider-smoke.result }}
          API29_RESULT: ${{ needs.android-api29-smoke.result }}
          APPLAB_RESULT: ${{ needs.applab-android.result }}
          PRO_ROUTING_RESULT: ${{ needs.applab-v15-pro.result }}
          UX_MATRIX_RESULT: ${{ needs.applab-ux-matrix.result }}
          UPGRADE_RESULT: ${{ needs.upgrade-migration.result }}
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "validate-and-build=$BUILD_RESULT" \
            "routing-provider-smoke=$ROUTING_PROVIDER_RESULT" \
            "android-api29-smoke=$API29_RESULT" \
            "applab-android=$APPLAB_RESULT" \
            "applab-v15-pro=$PRO_ROUTING_RESULT" \
            "applab-ux-matrix=$UX_MATRIX_RESULT" \
            "upgrade-migration=$UPGRADE_RESULT"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::Automated certification gate '$name' concluded '$result'."
              failed=1
            fi
          done
          test "$failed" -eq 0
