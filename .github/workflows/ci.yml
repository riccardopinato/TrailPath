name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate current Android and iOS scaffolding
        run: flutter create --platforms=android,ios --org com.riccardopinato --project-name trail_path .

      - name: Configure native location permissions
        run: dart run tool/configure_native.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format lib test tool

      - name: Commit formatting
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- lib test tool; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test tool
            git commit -m "style: apply dart format"
            git push
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.2.0-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
