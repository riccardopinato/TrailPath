name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate current Android and iOS scaffolding
        run: flutter create --platforms=android,ios --org com.riccardopinato --project-name trail_path .

      - name: Configure native location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          if "ACCESS_FINE_LOCATION" not in text:
              text = text.replace(marker, permissions)
              manifest.write_text(text)

          plist = Path("ios/Runner/Info.plist")
          text = plist.read_text()
          if "NSLocationWhenInUseUsageDescription" not in text:
              text = text.replace(
                  "</dict>",
                  "  <key>NSLocationWhenInUseUsageDescription</key>\n"
                  "  <string>TrailPath uses your location to show your position, follow outdoor routes and record tracks.</string>\n"
                  "  <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>\n"
                  "  <string>TrailPath uses background location only while you are recording an outdoor activity.</string>\n"
                  "  <key>UIBackgroundModes</key>\n"
                  "  <array>\n"
                  "    <string>location</string>\n"
                  "  </array>\n"
                  "</dict>",
              )
              plist.write_text(text)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.1-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
