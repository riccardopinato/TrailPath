name: TrailPath v1.5 final one-shot formatter

on:
  push:
    branches:
      - feature/v1.1-v1.5

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1.1-v1.5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: |
          dart format             lib/core/services/provider_usage_tracker.dart             lib/infrastructure/telemetry/local_provider_usage_tracker.dart             lib/core/services/service_providers.dart             lib/features/planner/presentation/planner_screen.dart             test/infrastructure/telemetry/local_provider_usage_tracker_test.dart
      - run: |
          rm .github/workflows/format-v15-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/core/services/provider_usage_tracker.dart             lib/infrastructure/telemetry/local_provider_usage_tracker.dart             lib/core/services/service_providers.dart             lib/features/planner/presentation/planner_screen.dart             test/infrastructure/telemetry/local_provider_usage_tracker_test.dart             .github/workflows/format-v15-final-once.yml
          git commit -m "style: format final v1.5 provider usage sources"
          git push origin HEAD:feature/v1.1-v1.5
