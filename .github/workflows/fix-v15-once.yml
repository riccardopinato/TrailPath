name: TrailPath v1.5 lint autofix

on:
  push:
    branches:
      - feature/v1.5-intelligence-stage

permissions:
  contents: write

jobs:
  fix-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1.5-intelligence-stage
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply
      - run: dart format lib test
      - run: |
          rm .github/workflows/fix-v15-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/fix-v15-once.yml
          git commit -m "style: apply v1.5 analyzer fixes"
          git push origin HEAD:feature/v1.5-intelligence-stage
