name: TrailPath v1.5 final formatter

on:
  push:
    branches:
      - feature/v1.5-units-final

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1.5-units-final
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Format v1.5 final sources
        run: |
          dart format             lib/core/localization/app_localizations.dart             lib/core/localization/measurement_formatter.dart             lib/features/navigation/presentation/navigation_screen.dart             lib/features/outdoor/presentation/back_to_car_screen.dart             lib/features/planner/application/route_planner_controller.dart             lib/features/planner/presentation/planner_screen.dart             lib/features/profile/presentation/personal_stats_screen.dart             lib/features/profile/presentation/profile_screen.dart             lib/features/recording/application/recording_controller.dart             lib/features/recording/presentation/record_screen.dart             lib/features/routes/presentation/route_collections_screen.dart             lib/features/routes/presentation/route_intelligence_screen.dart
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/format-v15-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test .github/workflows/format-v15-final-once.yml
          git commit -m "style: format v1.5 final sources"
          git push origin HEAD:feature/v1.5-units-final
