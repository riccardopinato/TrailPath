name: TrailPath v1.5 final formatter

on:
  push:
    branches:
      - feature/v1.5-intelligence-stage

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1.5-intelligence-stage
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: |
          dart format             lib/core/config/cloud_config.dart             lib/core/database/app_database.dart             lib/features/profile/application/cloud_sync_controller.dart             test/core/database/collection_sync_integrity_test.dart
      - run: |
          rm .github/workflows/format-v15-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/core/config/cloud_config.dart             lib/core/database/app_database.dart             lib/features/profile/application/cloud_sync_controller.dart             test/core/database/collection_sync_integrity_test.dart             .github/workflows/format-v15-final-once.yml
          git commit -m "style: format v1.5 final hardening"
          git push origin HEAD:feature/v1.5-intelligence-stage
