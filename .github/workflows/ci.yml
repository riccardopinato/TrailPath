name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      app_version: ${{ steps.app-version.outputs.app_version }}
      arm64_sha256: ${{ steps.certification-base.outputs.arm64_sha256 }}
      arm64_size: ${{ steps.certification-base.outputs.arm64_size }}
      store_signing: ${{ steps.store-signing.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Verify committed Android scaffold
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/riccardopinato/trail_path/MainActivity.kt
          test -f android/app/src/main/res/drawable/ic_launcher.xml
          test -f android/app/src/main/res/xml/data_extraction_rules.xml
          grep -Fq 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:dataExtractionRules="@xml/data_extraction_rules"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'TRAILPATH_REQUIRE_STORE_SIGNING' android/app/build.gradle.kts

      - name: Read app version
        id: app-version
        run: |
          APP_VERSION="$(awk '/^version:/ {print $2}' pubspec.yaml | cut -d+ -f1)"
          test -n "$APP_VERSION"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Audit dependency freshness
        run: |
          echo "Dependency freshness audit (informational):"
          flutter pub outdated --no-dev-dependencies || true

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Detect store signing credentials
        id: store-signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAILPATH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TRAILPATH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAILPATH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAILPATH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Store signing secrets are not configured; store-signed AAB will be skipped."
          fi

      - name: Build ARM64 optimized release
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Build x86_64 optimized release runtime gate
        run: flutter build apk --release --target-platform android-x64 --split-per-abi

      - name: Build release AAB structure gate
        run: flutter build appbundle --release

      - name: Upload CI-only AAB structure artifact
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-ci-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1

      - name: Build store-signed AAB
        if: steps.store-signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAILPATH_KEYSTORE_BASE64 }}
          TRAILPATH_STORE_PASSWORD: ${{ secrets.TRAILPATH_STORE_PASSWORD }}
          TRAILPATH_KEY_ALIAS: ${{ secrets.TRAILPATH_KEY_ALIAS }}
          TRAILPATH_KEY_PASSWORD: ${{ secrets.TRAILPATH_KEY_PASSWORD }}
          TRAILPATH_REQUIRE_STORE_SIGNING: "true"
        run: |
          set -euo pipefail
          umask 077
          STORE_FILE="$RUNNER_TEMP/trailpath-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          test -s "$STORE_FILE"
          TRAILPATH_STORE_FILE="$STORE_FILE" flutter build appbundle --release
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Upload store-signed AAB
        if: steps.store-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Report release APK sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*-release.apk
          du -b build/app/outputs/flutter-apk/*-release.apk | sort -n

      - name: Enforce ARM64 RC size budget
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          SIZE="$(stat -c%s "$APK")"
          MAX_BYTES=$((40 * 1024 * 1024))
          echo "ARM64 APK: $SIZE bytes; RC budget: $MAX_BYTES bytes"
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::ARM64 APK exceeds the 40 MiB release-candidate budget."
            exit 1
          fi

      - name: Write certification base evidence
        id: certification-base
        env:
          STORE_SIGNING_AVAILABLE: ${{ steps.store-signing.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p certification
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_SIZE="$(stat -c%s "$APK")"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          TESTED_COMMIT="$(git rev-parse HEAD)"
          {
            echo "TRAILPATH_CERTIFICATION_EVIDENCE_V1"
            echo "VERSION=${{ steps.app-version.outputs.app_version }}"
            echo "BUILD=28"
            echo "TESTED_COMMIT=$TESTED_COMMIT"
            echo "WORKFLOW_SHA=$GITHUB_SHA"
            echo "DART_FORMAT=PASS"
            echo "FLUTTER_ANALYZE=PASS"
            echo "FLUTTER_TEST=PASS"
            echo "ARM64_RELEASE_BUILD=PASS"
            echo "X86_64_RELEASE_BUILD=PASS"
            echo "AAB_STRUCTURE_BUILD=PASS"
            echo "STORE_SIGNING_AVAILABLE=$STORE_SIGNING_AVAILABLE"
            echo "ARM64_APK_SIZE_BYTES=$APK_SIZE"
            echo "ARM64_APK_SHA256=$APK_SHA256"
            echo "ARM64_SIZE_BUDGET_BYTES=$((40 * 1024 * 1024))"
          } > certification/evidence-base.txt
          echo "arm64_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "arm64_size=$APK_SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload certification base evidence
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-certification-base
          path: certification/evidence-base.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload x86_64 release runtime APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ steps.app-version.outputs.app_version }}-ci-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 1

  applab-android:
    name: AppLab Android E2E Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download x86_64 release APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-ci-x86_64
          path: apk

      - name: Download certification base evidence
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-certification-base
          path: certification

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run TrailPath release through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb install -r apk/app-x86_64-release.apk
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.POST_NOTIFICATIONS || true
            adb emu geo fix 11.7500 45.2320 100 || true

            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/.maestro/applab-e2e.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" .applab/scripts/verify_apk.sh "$GITHUB_WORKSPACE/apk/app-x86_64-release.apk" "com.riccardopinato.trail_path"

            # Reuse the persisted E2E route/offline region for a focused
            # no-network gate instead of replaying the entire online journey.
            bash "$GITHUB_WORKSPACE/.maestro/run-offline-e2e.sh"

            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"
            ! grep -Eq "ANR in com\\.riccardopinato\\.trail_path|Process: com\\.riccardopinato\\.trail_path.*FATAL" "$GITHUB_WORKSPACE/applab-report/logcat.txt"

      - name: Finalize v1.0.0 certification evidence
        env:
          APP_VERSION: ${{ needs.validate-and-build.outputs.app_version }}
          ARM64_SHA256: ${{ needs.validate-and-build.outputs.arm64_sha256 }}
          ARM64_SIZE: ${{ needs.validate-and-build.outputs.arm64_size }}
          STORE_SIGNING_AVAILABLE: ${{ needs.validate-and-build.outputs.store_signing }}
        run: |
          set -euo pipefail
          test -s certification/evidence-base.txt
          {
            cat certification/evidence-base.txt
            echo "APPLAB_ANDROID_E2E=PASS"
            echo "OFFLINE_NO_NETWORK_E2E=PASS"
            echo "APPLAB_DEVICE=Pixel_7_Pro_emulator"
            echo "APPLAB_API=35"
            echo "APPLAB_ARCH=x86_64"
            echo "PHYSICAL_DEVICE_QA=NOT_TESTED"
            echo "PLAY_STORE_SCREENSHOTS=NOT_TESTED"
            if [ "$STORE_SIGNING_AVAILABLE" = "true" ]; then
              echo "STORE_SIGNED_AAB=PASS"
            else
              echo "STORE_SIGNED_AAB=NOT_TESTED"
            fi
            echo "VERDICT=BLOCKED"
            echo "BLOCKERS=physical_device_QA,final_Play_Store_screenshots"
            if [ "$STORE_SIGNING_AVAILABLE" != "true" ]; then
              echo "BLOCKER_STORE_SIGNING=true"
            fi
            echo "CERTIFIED_ARTIFACT_SHA256=$ARM64_SHA256"
            echo "CERTIFIED_ARTIFACT_SIZE_BYTES=$ARM64_SIZE"
          } > "certification/TrailPath-v${APP_VERSION}-evidence-bundle.txt"

      - name: Upload v1.0.0 certification Evidence Bundle
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-evidence-bundle
          path: certification/TrailPath-v${{ needs.validate-and-build.outputs.app_version }}-evidence-bundle.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
