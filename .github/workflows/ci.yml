name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Validate committed native configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          root = ET.parse(manifest).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          permissions = {
              node.attrib.get(android + "name")
              for node in root.findall("uses-permission")
          }
          required = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.WAKE_LOCK",
              "android.permission.POST_NOTIFICATIONS",
          }
          missing = required - permissions
          if missing:
              raise RuntimeError(f"Missing Android permissions: {sorted(missing)}")
          if "android.permission.ACCESS_BACKGROUND_LOCATION" in permissions:
              raise RuntimeError("ACCESS_BACKGROUND_LOCATION must not be declared.")

          with Path("ios/Runner/Info.plist").open("rb") as handle:
              plist = plistlib.load(handle)
          for key in (
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
              "UIBackgroundModes",
          ):
              if key not in plist:
                  raise RuntimeError(f"Missing iOS plist key: {key}")
          if "location" not in plist["UIBackgroundModes"]:
              raise RuntimeError("iOS background location mode is missing.")
          print("Native configuration validation passed.")
          PY

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build release APKs by ABI
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Report release sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  applab-android:
    name: AppLab Android Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download debug APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v0.9.3-debug
          path: apk

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run TrailPath through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_COARSE_LOCATION || true

            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/.maestro/applab-smoke.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" .applab/scripts/verify_apk.sh "$GITHUB_WORKSPACE/apk/app-debug.apk" "com.riccardopinato.trail_path"

            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
