name: TrailPath CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trailpath-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Generate current Android and iOS scaffolding
        run: flutter create --platforms=android,ios --org com.riccardopinato --project-name trail_path .

      - name: Configure native location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          if "ACCESS_FINE_LOCATION" not in text:
              text = text.replace(marker, permissions)
              manifest.write_text(text)

          plist = Path("ios/Runner/Info.plist")
          text = plist.read_text()
          if "NSLocationWhenInUseUsageDescription" not in text:
              text = text.replace(
                  "</dict>",
                  "  <key>NSLocationWhenInUseUsageDescription</key>\n"
                  "  <string>TrailPath uses your location to show your position, follow outdoor routes and record tracks.</string>\n"
                  "  <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>\n"
                  "  <string>TrailPath uses background location only while you are recording an outdoor activity.</string>\n"
                  "  <key>UIBackgroundModes</key>\n"
                  "  <array>\n"
                  "    <string>location</string>\n"
                  "  </array>\n"
                  "</dict>",
              )
              plist.write_text(text)
          PY

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload generated native scaffolding snapshot
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-native-scaffolding
          path: |
            android/
            ios/
            pubspec.lock
          if-no-files-found: error
          retention-days: 7

      - name: Persist native scaffolding on v0.9.3 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/v0.9.3-outdoor-release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp_dir="$(mktemp -d)"
          git clone --depth 1 --branch "$GITHUB_HEAD_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$tmp_dir/repo"

          rsync -a --delete \
            --exclude '.gradle/' \
            --exclude 'local.properties' \
            --exclude '*.iml' \
            android/ "$tmp_dir/repo/android/"

          rsync -a --delete \
            --exclude 'Pods/' \
            --exclude '.symlinks/' \
            --exclude 'Flutter/ephemeral/' \
            --exclude 'Flutter/Generated.xcconfig' \
            --exclude 'Flutter/flutter_export_environment.sh' \
            ios/ "$tmp_dir/repo/ios/"

          cp pubspec.lock "$tmp_dir/repo/pubspec.lock"
          cd "$tmp_dir/repo"
          git add android ios pubspec.lock

          if git diff --cached --quiet; then
            echo "Native scaffolding is already versioned."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: version Flutter native scaffolding"
          git push origin "HEAD:$GITHUB_HEAD_REF"

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build release APKs by ABI
        run: flutter build apk --release --split-per-abi

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Report release sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/*-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload arm64 release APK
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-arm64-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: TrailPath-v0.9.3-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  applab-android:
    name: AppLab Android Gate
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout TrailPath
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download debug APK
        uses: actions/download-artifact@v6
        with:
          name: TrailPath-v0.9.3-debug
          path: apk

      - name: Checkout AppLab
        uses: actions/checkout@v6
        with:
          repository: riccardopinato/AppLab
          path: .applab

      - name: Install Maestro
        run: |
          chmod +x .applab/scripts/*.sh
          .applab/scripts/install_maestro.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run TrailPath through AppLab
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.riccardopinato.trail_path android.permission.ACCESS_COARSE_LOCATION || true

            RUN_MAESTRO=true MAESTRO_FLOW="$GITHUB_WORKSPACE/.maestro/applab-smoke.yaml" REPORT_DIR="$GITHUB_WORKSPACE/applab-report" .applab/scripts/verify_apk.sh "$GITHUB_WORKSPACE/apk/app-debug.apk" "com.riccardopinato.trail_path"

            grep -Fq -- "- Result: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            grep -Fq -- "- Maestro: PASS" "$GITHUB_WORKSPACE/applab-report/summary.md"
            test -s "$GITHUB_WORKSPACE/applab-report/launch.png"
            test -s "$GITHUB_WORKSPACE/applab-report/post-maestro.png"
            test -s "$GITHUB_WORKSPACE/applab-report/logcat.txt"

      - name: Upload AppLab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrailPath-AppLab-${{ github.sha }}
          path: applab-report/
          if-no-files-found: warn
          retention-days: 14
