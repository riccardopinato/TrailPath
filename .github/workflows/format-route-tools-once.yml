name: TrailPath route-tools one-shot formatter

on:
  push:
    branches:
      - feature/v1.1-v1.5

permissions:
  contents: write

jobs:
  format-and-self-remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1.1-v1.5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: |
          dart format             lib/features/planner/application/route_planner_controller.dart             test/features/planner/route_planner_controller_test.dart
      - run: |
          rm .github/workflows/format-route-tools-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             lib/features/planner/application/route_planner_controller.dart             test/features/planner/route_planner_controller_test.dart             .github/workflows/format-route-tools-once.yml
          git commit -m "style: format v1.1 route tools"
          git push origin HEAD:feature/v1.1-v1.5
